[project]
name = "shinx"
version = "0.1.0"
description = "LangGraph-powered SQL agent"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.2",
    "langgraph>=0.2.0",
    "psycopg>=3.3.6",
    "pydantic>=2.14.1",
]

[project.scripts]
shinx = "shinx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shinx"]
